<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选择年级 · 扫码进群</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e6faf4;
    color: #1a1a1a;
    min-height: 100vh;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 24px 60px;
  }

  /* 标题 */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #0aa878;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 14px;
    color: #666;
  }

  /* 分区 */
  .section {
    margin-bottom: 28px;
  }

  .section-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    padding-left: 2px;
    font-weight: 500;
  }

  /* 年级按钮网格 */
  .grade-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .grade-btn {
    background: #fff;
    border: 1px solid #d0ede4;
    border-radius: 12px;
    padding: 18px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .grade-btn:active {
    transform: scale(0.96);
    border-color: #00d4a0;
  }

  .grade-btn .name {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
  }

  /* 底部提示 */
  .footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: #aaa;
  }

  /* ===== 二维码弹窗 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .overlay.active {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 28px 24px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: none;
    background: #f3f4f6;
    border-radius: 50%;
    font-size: 14px;
    color: #999;
    cursor: pointer;
    line-height: 1;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .modal-sub {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }

  .qr-box {
    width: 200px;
    height: 200px;
    margin: 0 auto 16px;
    padding: 10px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #fff;
  }

  .qr-box img {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
  }

  .qr-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9fafb;
    border-radius: 4px;
    font-size: 12px;
    color: #bbb;
  }

  .modal-tip {
    font-size: 12px;
    color: #999;
    line-height: 1.6;
    padding-top: 16px;
    border-top: 1px solid #f0f0f0;
  }

  .modal-tip strong {
    color: #666;
    font-weight: 500;
  }

  /* 响应式 */
  @media (max-width: 360px) {
    .container { padding: 36px 20px 48px; }
    .header h1 { font-size: 20px; }
    .grade-grid { gap: 8px; }
    .grade-btn { padding: 14px 6px; }
    .grade-btn .name { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>请选择孩子所在年级</h1>
    <p>扫码加入对应年级学习群</p>
  </div>

  <div class="section">
    <div class="section-title">请选择年级</div>
    <div class="grade-grid">
      <div class="grade-btn" data-grade="三年级">
        <div class="name">三年级</div>
      </div>
      <div class="grade-btn" data-grade="四年级">
        <div class="name">四年级</div>
      </div>
      <div class="grade-btn" data-grade="五年级">
        <div class="name">五年级</div>
      </div>
      <div class="grade-btn" data-grade="六年级">
        <div class="name">六年级</div>
      </div>
      <div class="grade-btn" data-grade="七年级">
        <div class="name">七年级</div>
      </div>
    </div>
  </div>

  <div class="footer">
    群内主要分享英语学习资料
  </div>
</div>

<!-- 二维码弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="closeBtn">✕</button>
    <div class="modal-title" id="modalTitle">一年级学习群</div>
    <div class="modal-sub">长按识别二维码进群</div>
    <div class="qr-box">
      <div class="qr-placeholder" id="qrPlaceholder">请放置二维码图片</div>
      <img id="qrImage" src="" alt="二维码" style="display:none;">
    </div>
    <div class="modal-tip">
      打开微信 → 扫一扫 → <strong>加入群聊</strong>
    </div>
  </div>
</div>

<script>
  // ====== 配置：每个年级对应的二维码图片地址 ======
  const gradeQRConfig = {
    "三年级": "./qr-grade3.png",
    "四年级": "./qr-grade4.png",
    "五年级": "./qr-grade5.png",
    "六年级": "./qr-grade6.png",
    "七年级": "./qr-grade7.png"
  };
  // ================================================

  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const modalTitle = document.getElementById('modalTitle');
  const qrImage = document.getElementById('qrImage');
  const qrPlaceholder = document.getElementById('qrPlaceholder');

  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const grade = btn.dataset.grade;
      modalTitle.textContent = grade + '学习群';

      const qrUrl = gradeQRConfig[grade];
      if (qrUrl) {
        qrImage.src = qrUrl;
        qrImage.style.display = 'block';
        qrPlaceholder.style.display = 'none';
      } else {
        qrImage.style.display = 'none';
        qrPlaceholder.style.display = 'flex';
      }

      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
  });

  function closeModal() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
